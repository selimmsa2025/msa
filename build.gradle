plugins {
    id 'java'
    id 'org.springframework.boot' version "${springBootVersion}"
    id 'io.spring.dependency-management' version "${springDependencyManagementVersion}"
    
    //소나큐브
    id "org.sonarqube" version "${sonarqubeVersion}"
}

group = 'kr.go'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '17'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
    all {
        exclude group: 'org.apache.logging.log4j', module: 'log4j-slf4j-impl'
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    //implementation 'org.springframework.boot:spring-boot-starter-amqp'
    implementation 'org.springframework.cloud:spring-cloud-starter-config'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:2.3.2'
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j'
    implementation "org.egovframe.rte:org.egovframe.rte.fdl.crypto:${eGovFrameVersion}"
    //implementation 'tibero:tibero7-jdbc-18:1.0'
    //implementation 'io.jsonwebtoken:jjwt:0.9.1'
    // JWT only
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'
    
    implementation 'net.logstash.logback:logstash-logback-encoder:7.2'        // logstash logback
    implementation 'org.jasypt:jasypt:1.9.3'
    implementation 'org.apache.commons:commons-collections4:4.5.0'
    implementation 'com.googlecode.json-simple:json-simple:1.1.1'
    implementation 'commons-codec:commons-codec:1.18.0'
    implementation 'javax.xml.bind:jaxb-api:2.3.1'
    implementation 'com.sun.xml.bind:jaxb-core:2.3.0.1'
    implementation 'com.sun.xml.bind:jaxb-impl:2.3.9'
    implementation 'org.springdoc:springdoc-openapi-ui:1.7.0'
    implementation 'org.aspectj:aspectjweaver:1.9.24'
    implementation 'com.github.ulisesbocchio:jasypt-spring-boot-starter:3.0.5'
    
    //posgresql 추가
    implementation 'org.postgresql:postgresql:42.7.3'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    //implementation 'org.springframework.cloud:spring-cloud-starter-gateway'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    //implementation 'org.springframework.cloud:spring-cloud-starter-config'    // config
    implementation 'org.springframework.cloud:spring-cloud-starter-bootstrap' // config
   //implementation files('/lib/onnara-cmmn-2025.03.04.jar')
    

    //아우터 아키텍처 구성요소
    //implementation 'org.springframework.cloud:spring-cloud-sleuth-otel-autoconfigure'
    //implementation 'io.opentelemetry:opentelemetry-exporter-otlp:1.23.1'
    //implementation 'io.opentelemetry:opentelemetry-exporter-zipkin:1.23.1'
    //implementation "opentelemetry-conf:opentelemetry-conf-selim:${opentelemetryVersion}"
    //implementation 'io.micrometer:micrometer-registry-prometheus'

    runtimeOnly 'com.h2database:h2:1.4.200' //테스트용
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:2.3.1'
    testImplementation 'org.springframework.security:spring-security-test'
    
    //0911 엑셀 다운로드 poi임시추가 
    //implementation files('libs/poi-5.4.1.jar')
    //implementation files('libs/poi-ooxml-5.4.1.jar')
    implementation "org.apache.poi:poi-ooxml:5.4.1"
    
    // 09.15 feignclient 추가
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
   
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
        //mavenBom "org.springframework.cloud:spring-cloud-sleuth-otel-dependencies:${otelVersion}"
    }
}

tasks.named('test') {
    doFirst {
        systemProperty 'spring.profiles.active', 'local, jenkins-junit'
    }
    useJUnitPlatform()
}
