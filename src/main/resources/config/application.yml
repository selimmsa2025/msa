spring:
  config:
    import:
    - application-db.yml #local db 정보
  profiles:
    active: local #default
    group:
      local:
        - saas-db-local
      dev:
        - saas-db-dev
      ops:
        - saas-db-ops
  cloud:
    config:
      enabled: false

---
spring:
  config:
    activate:
      on-profile:
      - local
      - dev
      - ops
  application:
    name: iop-ci-catalog

server:
  port: 9991

system-info: iop-ci-catalog

info:
  app:
    name: 카탈로그 서비스 (${spring.profiles.active})
    description: 카탈로그 관리자 화면, 카탈로그 포탈 이용하거나 관리하기 위한 서비스
    version: v0.0.1

feign.circuitbreaker.enabled: true
 
---
saas:
  dev:
    url: http://localhost:9991
  prod:
    url: http://localhost:9991
    
---
jwt:
  secret: mySuperSecretKeyForJWTGenerationChangeThisIsLongEnough123!
  access-expiration: 600000 #3600000        # 1시간 (밀리초)  60000  10분
  refresh-expiration: 2592000000    # 30일 (밀리초)
